version: '3.8'

networks:
  ml-network:
    driver: bridge

services:
  # ml-api:
  #   container_name: interact-ml
  #   build:
  #     context: .
  #     dockerfile: dev.DockerFile
  #   restart: always
  #   ports:
  #     - "3030:3030"
