  #     - postgres
  #   volumes:
  #     - ./models:/app/models
  #     - ./logs:/app/logs
  #   networks:
  #     - ml-network

  postgres:
    container_name: postgres-ml-db
    image: postgres:16
    restart: always
    ports:
      - "5432:${DB_PORT}"
    env_file:
      - .env
    environment:
      - POSTGRES_DB=${DB_NAME}
      - POSTGRES_PASSWORD=${DB_PASS}
      - POSTGRES_USER=${DB_USER}
    volumes:
      - ml-postgres:/var/lib/postgresql/data
      - ./populate/init.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - ml-network
    healthcheck:
      test: ["CMD", "pg_isready", "-q", "-d", "${DB_NAME}", "-U", "${DB_USER}"]
      interval: 5s
      timeout: 5s
      retries: 3

volumes:
  ml-postgres:
    name: postgres-ml-db
    driver: local